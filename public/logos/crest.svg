<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Crest Secondary">
  <defs>
    <clipPath id="crestBody">
      <rect x="0" y="0" width="400" height="500" rx="30" ry="30"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="400" height="500" rx="30" ry="30" fill="#0a2d6e"/>
  <g clip-path="url(#crestBody)">
    <!-- Outer cyan swoosh -->
    <path d="M -30 540 C -30 80, 220 -20, 430 -10 C 230 70, 120 220, 60 460 Q 40 510 60 540 Z" fill="#4fb8dc"/>
    <!-- Yellow middle swoosh -->
    <path d="M 40 520 C 50 170, 220 90, 380 50 C 220 140, 170 280, 130 470 Q 110 510 130 520 Z" fill="#f4d80b"/>
    <!-- Inner cyan swoosh -->
    <path d="M 120 500 C 130 290, 220 230, 300 180 C 230 220, 200 310, 190 460 Q 175 495 195 500 Z" fill="#4fb8dc"/>
    <!-- Innermost yellow accent -->
    <path d="M 175 490 C 185 340, 225 290, 270 250 C 230 300, 220 360, 220 470 Q 210 490 225 490 Z" fill="#f4d80b"/>
  </g>
  <!-- Name -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" fill="#ffffff" font-weight="900">
    <text x="198" y="445" text-anchor="middle" font-size="52" letter-spacing="2">CREST</text>
    <text x="198" y="478" text-anchor="middle" font-size="28" letter-spacing="1.6">SECONDARY</text>
  </g>
</svg>
