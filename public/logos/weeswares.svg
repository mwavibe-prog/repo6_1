<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="WeesWares">
  <!-- Word mark -->
  <text x="30" y="258" font-family="Arial, 'Helvetica Neue', sans-serif"
        font-weight="900" font-size="150" letter-spacing="2" fill="#5a6574">WEESWARES</text>

  <!-- Stylized W mark -->
  <g>
    <!-- Left purple slash -->
    <polygon points="670,40 780,40 820,310 720,310" fill="#6a2e7e"/>
    <!-- Left orange slash (first V-leg) -->
    <polygon points="720,310 820,310 840,170 760,40" fill="#e8792e"/>
    <!-- Inverted purple triangle at crown -->
    <polygon points="820,40 855,115 790,40" fill="#6a2e7e"/>
    <!-- Right orange slash (second V-leg) -->
    <polygon points="855,40 960,40 890,310 820,310" fill="#f4a052"/>
  </g>
</svg>
