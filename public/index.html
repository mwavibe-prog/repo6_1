<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a2d6e" />
<title>Co-op Climb — A Teamwork Game</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ======================================================= -->
  <!-- Shared brand header (logos side-by-side, always visible) -->
  <!-- ======================================================= -->
  <header id="brand-bar">
    <img src="logos/crest-logo.png" alt="Crest Secondary" class="brand-logo brand-logo-crest" />
    <img src="logos/weeswares-logo.png" alt="WeesWares" class="brand-logo brand-logo-weeswares" />
    <button id="sound-toggle" class="sound-toggle" aria-label="Toggle sound" title="Toggle sound">
      <span class="sound-icon sound-on" aria-hidden="true">🔊</span>
      <span class="sound-icon sound-off" aria-hidden="true">🔇</span>
    </button>
  </header>

  <!-- ======================================================= -->
  <!-- LANDING SCREEN: shown when there is no ?room= in the URL -->
  <!-- ======================================================= -->
  <section id="landing" class="screen">
    <div class="landing-inner">
      <h1>Co-op Climb</h1>
      <p class="tagline">A friendly teamwork game for everyone.</p>

      <button id="btn-start" class="big-btn primary">
        <span class="big-btn-label">Start a New Game</span>
        <span class="big-btn-hint">Shows a QR code on your TV for friends to scan</span>
      </button>

      <div class="or-divider"><span>or</span></div>

      <div id="join-by-code" class="join-code-row">
        <label for="code-input" class="code-label">I have a room number:</label>
        <input id="code-input" type="tel" inputmode="numeric" pattern="[0-9]*"
               maxlength="4" placeholder="1234" autocomplete="off" />
        <button id="btn-join" class="big-btn secondary">Join Game</button>
      </div>

      <p id="landing-error" class="error" aria-live="polite"></p>
    </div>
  </section>

  <!-- ======================================================= -->
  <!-- HOST / TV SCREEN: shown when host=1                     -->
  <!-- Displays the game, a big room code, and the QR code.    -->
  <!-- ======================================================= -->
  <section id="host-screen" class="screen hidden">
    <div class="host-layout">
      <div class="host-left">
        <canvas id="game-canvas"></canvas>
        <div id="host-hud">
          <div class="host-hud-card">
            <div class="host-hud-label">Level</div>
            <div class="host-hud-value" id="host-level-name">Level 1</div>
          </div>
          <div class="host-hud-card">
            <div class="host-hud-label">Friends at flag</div>
            <div class="host-hud-value" id="host-goal-meter">0 of 0</div>
          </div>
          <div class="host-hud-card">
            <div class="host-hud-label">Players</div>
            <div class="host-hud-value" id="host-player-count">0 / 15</div>
          </div>
        </div>
        <div id="host-hint" class="host-hint"></div>
      </div>

      <aside class="host-right">
        <div class="join-card">
          <div class="join-card-title">To play, use your phone</div>
          <div class="join-steps">
            <div class="join-step">1. Scan the QR code<br/><small>or open the link</small></div>
          </div>
          <img id="qr-image" class="qr-image" alt="Scan to join" />
          <div class="join-card-subtitle">Room Number</div>
          <div id="room-code" class="room-code">----</div>
          <div class="join-url-row">
            <span class="join-url-label">Link:</span>
            <span id="room-url" class="room-url"></span>
          </div>
        </div>

        <div id="host-player-list" class="host-player-list">
          <div class="list-title">Players in this game</div>
          <div id="host-player-list-body"></div>
        </div>
      </aside>
    </div>
    <div id="host-toast" class="toast"></div>
  </section>

  <!-- ======================================================= -->
  <!-- PLAYER SCREEN: shown when ?room=XXXX (no host=1)        -->
  <!-- Mobile-friendly. Game view on top, big touch buttons.   -->
  <!-- ======================================================= -->
  <section id="player-screen" class="screen hidden">
    <div id="player-name-step" class="player-name-step">
      <div class="player-name-card">
        <h2>Welcome!</h2>
        <p class="room-prompt">Joining room <strong id="player-room-code">----</strong></p>
        <label for="player-name-input">What's your name?</label>
        <input id="player-name-input" type="text" maxlength="14" placeholder="Your name" autocomplete="off" />
        <button id="player-name-go" class="big-btn primary">Start Playing</button>
        <p id="player-name-error" class="error" aria-live="polite"></p>
      </div>
    </div>

    <div id="player-game" class="player-game hidden">
      <canvas id="player-canvas"></canvas>
      <div id="player-hud">
        <div class="player-hud-name" id="player-hud-name">—</div>
        <div class="player-hud-level" id="player-hud-level">Level 1</div>
      </div>
      <div id="player-hint" class="player-hint"></div>

      <!-- Big touch controls — designed for easy tapping -->
      <div id="touch-controls">
        <button class="touch-btn touch-left" data-key="left" aria-label="Move left">
          <svg viewBox="0 0 60 60" aria-hidden="true"><polygon points="44,6 16,30 44,54" fill="currentColor"/></svg>
        </button>
        <button class="touch-btn touch-jump" data-key="jump" aria-label="Jump">
          <svg viewBox="0 0 60 60" aria-hidden="true"><polygon points="30,8 54,44 6,44" fill="currentColor"/></svg>
          <span>JUMP</span>
        </button>
        <button class="touch-btn touch-right" data-key="right" aria-label="Move right">
          <svg viewBox="0 0 60 60" aria-hidden="true"><polygon points="16,6 44,30 16,54" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
    <div id="player-toast" class="toast"></div>
  </section>

  <script src="sound.js"></script>
  <script src="game.js"></script>
</body>
</html>
